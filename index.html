<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema SST – NR35 + NR18</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- AutoTable -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<style>
body{font-family:Arial;margin:0;padding:15px;background:#f4f6f8;}
header{text-align:center;padding:20px;background:#003366;color:#fff;border-radius:12px;}
h1{margin:0;font-size:22px;}

.btn{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:none;
  border-radius:12px;
  background:#0059b3;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.pdf{background:darkred;}
.back{background:gray;}
.whats{background:#25D366;}

section{
  display:none;
  background:white;
  padding:15px;
  margin-top:15px;
  border-radius:12px;
}

input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-top:6px;
}

canvas{
  width:100%;
  height:140px;
  border:2px solid black;
  border-radius:10px;
  background:white;
  touch-action:none;
}

hr{margin:20px 0;}
</style>
</head>

<body>

<header>
<h1>Sistema Único SST</h1>
<p><b>FREIBERGER & FERNANDES – Engenharia</b></p>
<p>Padrão Fiscalização Oficial</p>
</header>

<!-- ================= MENU ================= -->
<section id="menu" style="display:block;">
<button class="btn" onclick="abrir('nr35')">📋 NR35 – Trabalho em Altura</button>
<button class="btn" onclick="abrir('nr18')">🦺 NR18 – Checklist Fiscalização</button>
</section>

<!-- ================= NR35 ================= -->
<section id="nr35">
<h2>📋 NR35 – Autorização Trabalho em Altura</h2>

<label>Local da Obra:</label>
<input id="local35">

<label>Empresa:</label>
<input id="empresa35">

<hr>

<h3>Trabalhadores (5) + Assinatura</h3>
<div id="listaTrabalhadores"></div>

<button class="btn pdf" onclick="gerarPDF_NR35()">📄 Gerar PDF Oficial NR35</button>
<button class="btn whats" onclick="enviarWhats('NR35')">📲 WhatsApp Engenheiro</button>
<button class="btn back" onclick="abrir('menu')">⬅ Voltar</button>
</section>

<!-- ================= NR18 ================= -->
<section id="nr18">
<h2>🦺 NR18 – Checklist Fiscalização</h2>

<label>Obra:</label>
<input id="obra18">

<label>Responsável:</label>
<input id="resp18">

<hr>

<button class="btn pdf" onclick="gerarPDF_NR18()">📄 Gerar PDF Oficial NR18</button>
<button class="btn whats" onclick="enviarWhats('NR18')">📲 WhatsApp Engenheiro</button>
<button class="btn back" onclick="abrir('menu')">⬅ Voltar</button>
</section>

<script>
/* ================= MENU ================= */
function abrir(id){
  document.querySelectorAll("section").forEach(sec=>sec.style.display="none");
  document.getElementById(id).style.display="block";

  if(id==="nr35") carregarTrabalhadores();
}

/* ================= NR35 CHECKLIST ================= */
const checklistNR35=[
 ["Funcionário treinado na atividade?"],
 ["Exame médico ocupacional válido?"],
 ["Risco de contato com energia elétrica?"],
 ["Área isolada e sinalizada?"],
 ["Linha de Vida instalada e inspecionada?"],
 ["Cinturão paraquedista em perfeito estado?"],
 ["Talabarte com absorvedor íntegro?"],
 ["Trava-quedas funcionando corretamente?"],
 ["Mosquetões sem deformações?"],
 ["Guarda-corpo e rodapé instalados?"],
 ["Ancoragem validada com ART?"]
];

/* ================= NR18 CHECKLIST COMPLETO ================= */
const checklistNR18=[
 ["Capacete com jugular obrigatório?"],
 ["Botas com biqueira de aço?"],
 ["Luvas adequadas à atividade?"],
 ["Óculos de proteção?"],
 ["Protetor auricular quando aplicável?"],
 ["Máscara/respirador poeira ou fumos?"],
 ["Cinturão para trabalho em altura?"],
 ["EPIs em bom estado de conservação?"],
 ["EPIs com CA válido?"],
 ["Colaboradores treinados para uso correto?"],

 ["Guarda-corpos e rodapés instalados?"],
 ["Andaimes travados, nivelados e completos?"],
 ["Plataformas/bandejas de retenção instaladas?"],
 ["Linhas de Vida instaladas e inspecionadas?"],
 ["Proteção em aberturas de piso e lajes?"],
 ["Isolamento e sinalização áreas de risco?"],
 ["Painéis elétricos protegidos e aterrados?"],
 ["Rampas e passarelas com corrimão?"],
 ["EPCs em bom estado geral?"]
];

/* ================= TRABALHADORES ================= */
let pads=[];

function carregarTrabalhadores(){
  let div=document.getElementById("listaTrabalhadores");
  div.innerHTML="";
  pads=[];

  for(let i=1;i<=5;i++){
    div.innerHTML+=`
      <h4>Trabalhador ${i}</h4>
      <input id="nome${i}" placeholder="Nome completo">
      <input id="cpf${i}" placeholder="CPF obrigatório">
      <canvas id="canvas${i}"></canvas>
      <button class="btn back" onclick="limparCanvas(${i})">Limpar</button>
      <hr>
    `;
  }

  setTimeout(()=>{
    for(let i=1;i<=5;i++){
      let canvas=document.getElementById("canvas"+i);
      canvas.width=canvas.offsetWidth;
      canvas.height=140;
      iniciarAssinatura(canvas,i);
    }
  },300);
}

function iniciarAssinatura(canvas,i){
  let ctx=canvas.getContext("2d");
  let desenhando=false;

  canvas.addEventListener("pointerdown",e=>{
    desenhando=true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX,e.offsetY);
  });

  canvas.addEventListener("pointermove",e=>{
    if(!desenhando) return;
    ctx.lineTo(e.offsetX,e.offsetY);
    ctx.stroke();
  });

  canvas.addEventListener("pointerup",()=>desenhando=false);

  pads[i]={canvas,ctx};
}

function limparCanvas(i){
  pads[i].ctx.clearRect(0,0,pads[i].canvas.width,pads[i].canvas.height);
}

/* ================= PDF NR35 ================= */
function gerarPDF_NR35(){
  const { jsPDF } = window.jspdf;
  let doc=new jsPDF();

  doc.text("NR35 – AUTORIZAÇÃO TRABALHO EM ALTURA",14,15);
  doc.text("Local: "+local35.value,14,25);
  doc.text("Empresa: "+empresa35.value,14,32);

  let corpo=[];
  checklistNR35.forEach(item=>{
    corpo.push([item[0],"","","",""]);
  });

  doc.autoTable({
    startY:40,
    head:[["ITEM","SIM","NÃO","N/A","MEDIDAS"]],
    body:corpo,
    theme:"grid"
  });

  let y=doc.lastAutoTable.finalY+10;
  doc.text("TRABALHADORES:",14,y);

  y+=6;
  for(let i=1;i<=5;i++){
    doc.text(`${i}. ${nome${i}.value} CPF:${cpf${i}.value}`,14,y);
    let img=pads[i].canvas.toDataURL("image/png");
    doc.addImage(img,"PNG",140,y-4,50,15);
    y+=18;
  }

  doc.save("NR35_Oficial.pdf");
}

/* ================= PDF NR18 ================= */
function gerarPDF_NR18(){
  const { jsPDF } = window.jspdf;
  let doc=new jsPDF();

  doc.text("NR18 – CHECKLIST FISCALIZAÇÃO",14,15);
  doc.text("Obra: "+obra18.value,14,25);
  doc.text("Responsável: "+resp18.value,14,32);

  let corpo=[];
  checklistNR18.forEach(item=>{
    corpo.push([item[0],"","","",""]);
  });

  doc.autoTable({
    startY:40,
    head:[["ITEM","SIM","NÃO","N/A","OBSERVAÇÃO"]],
    body:corpo,
    theme:"grid"
  });

  doc.save("NR18_Oficial.pdf");
}

/* ================= WHATS ================= */
function enviarWhats(tipo){
  let msg=`${tipo} preenchida no Sistema SST – Freiberguer & Fernandes`;
  window.open("https://wa.me/5547988837699?text="+encodeURIComponent(msg));
}
</script>

</body>
</html>
