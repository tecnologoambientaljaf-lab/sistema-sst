<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema SST – NR35 + NR18</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<style>
body{font-family:Arial;margin:0;padding:15px;background:#f4f6f8;}
header{text-align:center;padding:20px;background:#003366;color:#fff;border-radius:12px;}
h1{margin:0;font-size:22px;}

.btn{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:none;
  border-radius:12px;
  background:#0059b3;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.save{background:green;}
.pdf{background:darkred;}
.back{background:gray;}
.whats{background:#25D366;}

section{
  display:none;
  background:white;
  padding:15px;
  margin-top:15px;
  border-radius:12px;
}

input,select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-top:6px;
}

canvas{
  width:100%;
  height:140px;
  border:2px solid black;
  border-radius:10px;
  background:white;
  touch-action:none;
}

.checkItem{
  margin:8px 0;
  padding:8px;
  border:1px solid #ddd;
  border-radius:8px;
}

hr{margin:20px 0;}
</style>
</head>

<body>

<header>
<h1>Sistema Único SST</h1>
<p><b>FREIBERGER & FERNANDES – Engenharia</b></p>
<p>NR35 + NR18 – Fiscalização Oficial</p>
</header>

<!-- MENU -->
<section id="menu" style="display:block;">
<button class="btn" onclick="abrir('nr35')">📋 NR35 – Trabalho em Altura</button>
<button class="btn" onclick="abrir('nr18')">🦺 NR18 – Checklist Obra</button>
<button class="btn" onclick="abrir('historico')">📂 Histórico Salvo</button>
</section>

<!-- ================= NR35 ================= -->
<section id="nr35">
<h2>📋 NR35 – Checklist Trabalho em Altura</h2>

<label>Local da Obra:</label>
<input id="local35">

<label>Empresa:</label>
<input id="empresa35">

<hr>

<h3>Checklist NR35</h3>
<div id="checkNR35"></div>

<hr>

<h3>Trabalhadores + Assinatura</h3>
<div id="listaTrabalhadores"></div>

<button class="btn save" onclick="salvarChecklist('NR35')">💾 Salvar NR35</button>
<button class="btn pdf" onclick="gerarPDF_NR35()">📄 Gerar PDF NR35</button>
<button class="btn whats" onclick="enviarWhats('NR35')">📲 WhatsApp Engenheiro</button>
<button class="btn back" onclick="abrir('menu')">⬅ Voltar</button>
</section>

<!-- ================= NR18 ================= -->
<section id="nr18">
<h2>🦺 NR18 – Checklist Fiscalização</h2>

<label>Obra:</label>
<input id="obra18">

<label>Responsável:</label>
<input id="resp18">

<hr>

<h3>Checklist NR18</h3>
<div id="checkNR18"></div>

<button class="btn save" onclick="salvarChecklist('NR18')">💾 Salvar NR18</button>
<button class="btn pdf" onclick="gerarPDF_NR18()">📄 Gerar PDF NR18</button>
<button class="btn whats" onclick="enviarWhats('NR18')">📲 WhatsApp Engenheiro</button>
<button class="btn back" onclick="abrir('menu')">⬅ Voltar</button>
</section>

<!-- ================= HISTÓRICO ================= -->
<section id="historico">
<h2>📂 Histórico de Checklists</h2>
<div id="listaHistorico"></div>
<button class="btn back" onclick="abrir('menu')">⬅ Voltar</button>
</section>

<script>
/* ================= CHECKLISTS ================= */

const checklistNR35=[
 "Funcionário treinado na atividade?",
 "Exame médico ocupacional válido?",
 "Área isolada e sinalizada?",
 "Linha de Vida instalada e inspecionada?",
 "Cinturão paraquedista verificado?",
 "Talabarte com absorvedor íntegro?",
 "Trava-quedas funcionando corretamente?",
 "Mosquetões sem deformações?",
 "Guarda-corpo e rodapé instalados?",
 "Ancoragem validada com ART?"
];

const checklistNR18=[
 "Capacete com jugular obrigatório?",
 "Botas com biqueira de aço?",
 "Óculos de proteção?",
 "Luvas adequadas?",
 "Cinto para trabalho em altura?",
 "EPIs com CA válido?",
 "Guarda-corpos e rodapés instalados?",
 "Andaimes travados e completos?",
 "Linhas de Vida instaladas?",
 "Sinalização e isolamento de áreas de risco?",
 "Painéis elétricos protegidos e aterrados?",
 "Rampas e passarelas com corrimão?"
];

/* ================= MENU ================= */
function abrir(id){
  document.querySelectorAll("section").forEach(sec=>sec.style.display="none");
  document.getElementById(id).style.display="block";

  if(id==="nr35"){
    montarChecklist("checkNR35", checklistNR35);
    carregarTrabalhadores();
  }

  if(id==="nr18"){
    montarChecklist("checkNR18", checklistNR18);
  }

  if(id==="historico"){
    carregarHistorico();
  }
}

/* ================= MOSTRAR CHECKLIST ================= */
function montarChecklist(divId, lista){
  let html="";
  lista.forEach((item,i)=>{
    html+=`
      <div class="checkItem">
        ${item}
        <select id="${divId}_${i}">
          <option>SIM</option>
          <option>NÃO</option>
          <option>N/A</option>
        </select>
      </div>
    `;
  });
  document.getElementById(divId).innerHTML=html;
}

/* ================= TRABALHADORES ================= */
let pads=[];

function carregarTrabalhadores(){
  let div=document.getElementById("listaTrabalhadores");
  div.innerHTML="";
  pads=[];

  for(let i=1;i<=5;i++){
    div.innerHTML+=`
      <h4>Trabalhador ${i}</h4>
      <input id="nome${i}" placeholder="Nome completo">
      <input id="cpf${i}" placeholder="CPF obrigatório">

      <canvas id="canvas${i}"></canvas>
      <button class="btn back" onclick="limparCanvas(${i})">Limpar</button>
      <hr>
    `;
  }

  setTimeout(()=>{
    for(let i=1;i<=5;i++){
      let canvas=document.getElementById("canvas"+i);
      canvas.width=canvas.offsetWidth;
      canvas.height=140;
      iniciarAssinatura(canvas,i);
    }
  },300);
}

function iniciarAssinatura(canvas,i){
  let ctx=canvas.getContext("2d");
  let desenhando=false;

  canvas.addEventListener("pointerdown",e=>{
    desenhando=true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX,e.offsetY);
  });

  canvas.addEventListener("pointermove",e=>{
    if(!desenhando) return;
    ctx.lineTo(e.offsetX,e.offsetY);
    ctx.stroke();
  });

  canvas.addEventListener("pointerup",()=>desenhando=false);

  pads[i]={canvas,ctx};
}

function limparCanvas(i){
  pads[i].ctx.clearRect(0,0,pads[i].canvas.width,pads[i].canvas.height);
}

/* ================= SALVAR HISTÓRICO ================= */
function salvarChecklist(tipo){
  let data=new Date().toLocaleString();

  let registros=JSON.parse(localStorage.getItem("sst")||"[]");
  registros.push({tipo:tipo,data:data});
  localStorage.setItem("sst",JSON.stringify(registros));

  alert("✅ Checklist "+tipo+" salvo com sucesso!");
}

/* ================= CARREGAR HISTÓRICO ================= */
function carregarHistorico(){
  let registros=JSON.parse(localStorage.getItem("sst")||"[]");
  let html="";

  registros.reverse().forEach(r=>{
    html+=`<p>✅ <b>${r.tipo}</b> – ${r.data}</p><hr>`;
  });

  document.getElementById("listaHistorico").innerHTML=
    html || "<p>Nenhum checklist salvo ainda.</p>";
}

/* ================= PDF NR35 ================= */
function gerarPDF_NR35(){
  const { jsPDF } = window.jspdf;
  let doc=new jsPDF();

  doc.text("NR35 – AUTORIZAÇÃO TRABALHO EM ALTURA",14,15);

  let corpo=[];
  checklistNR35.forEach((item,i)=>{
    let val=document.getElementById("checkNR35_"+i).value;
    corpo.push([item,val]);
  });

  doc.autoTable({
    startY:25,
    head:[["ITEM","STATUS"]],
    body:corpo,
    theme:"grid"
  });

  doc.save("NR35_Oficial.pdf");
}

/* ================= PDF NR18 ================= */
function gerarPDF_NR18(){
  const { jsPDF } = window.jspdf;
  let doc=new jsPDF();

  doc.text("NR18 – CHECKLIST FISCALIZAÇÃO",14,15);

  let corpo=[];
  checklistNR18.forEach((item,i)=>{
    let val=document.getElementById("checkNR18_"+i).value;
    corpo.push([item,val]);
  });

  doc.autoTable({
    startY:25,
    head:[["ITEM","STATUS"]],
    body:corpo,
    theme:"grid"
  });

  doc.save("NR18_Oficial.pdf");
}

/* ================= WHATS ================= */
function enviarWhats(tipo){
  let msg=`Checklist ${tipo} preenchido no Sistema SST – Freiberguer & Fernandes`;
  window.open("https://wa.me/5547988837699?text="+encodeURIComponent(msg));
}
</script>

</body>
</html>
