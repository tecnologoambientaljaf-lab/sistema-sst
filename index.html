<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Único SST – NR35 + NR18</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{font-family:Arial;margin:0;padding:15px;background:#f4f6f8;}
header{text-align:center;padding:20px;background:#003366;color:#fff;border-radius:12px;}
h1{margin:0;font-size:22px;}

.btn{
  width:100%;padding:14px;margin:10px 0;
  border:none;border-radius:12px;
  font-size:16px;font-weight:bold;
  color:white;
}
.nr35{background:#0059b3;}
.nr18{background:#006600;}
.pdf{background:darkred;}
.whats{background:#25D366;}
.back{background:gray;}

section{
  display:none;
  background:white;
  padding:15px;
  margin-top:15px;
  border-radius:12px;
}

input,select,textarea{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #ccc;
}

canvas{
  width:100%;
  height:140px;
  border:2px solid black;
  border-radius:10px;
  background:white;
  touch-action:none;
}

hr{margin:20px 0;}
h3{margin-top:25px;}
small{color:#444;}
</style>
</head>

<body>

<header>
<h1>Sistema Único SST</h1>
<p><b>FREIBERGER & FERNANDES – Engenharia</b></p>
<p>Padrão Fiscalização Oficial</p>
</header>

<!-- MENU -->
<section id="menu" style="display:block;">
<button class="btn nr35" onclick="abrir('nr35')">📋 NR35 – Trabalho em Altura</button>
<button class="btn nr18" onclick="abrir('nr18')">🦺 NR18 – Checklist Fiscalização</button>
</section>

<!-- ======================= NR35 ======================= -->
<section id="nr35">
<h2>📋 NR35 – Autorização Trabalho em Altura</h2>

<label>Local da Obra:</label>
<input id="local35">

<label>Empresa:</label>
<input id="empresa35">

<hr>

<h3>Capacitação / Riscos Gerais</h3>
<div id="riscos35"></div>

<hr>

<h3>Trabalhadores Autorizados (5)</h3>
<div id="listaTrabalhadores"></div>

<button class="btn pdf" onclick="gerarPDF_NR35()">📄 Gerar PDF NR35 Oficial</button>
<button class="btn whats" onclick="enviarWhats()">📲 Enviar WhatsApp (Anexar PDF)</button>
<button class="btn back" onclick="abrir('menu')">⬅ Voltar</button>
</section>

<!-- ======================= NR18 ======================= -->
<section id="nr18">
<h2>🦺 NR18 – Checklist Fiscalização</h2>

<label>Obra:</label>
<input id="obra18">

<label>Responsável:</label>
<input id="resp18">

<hr>

<h3>Capacitação / Riscos Gerais</h3>
<div id="riscos18"></div>

<hr>

<h3>EPI</h3>
<label>Capacete: <select id="epi1"><option>SIM</option><option>NÃO</option></select></label>
<label>Botina: <select id="epi2"><option>SIM</option><option>NÃO</option></select></label>
<label>Luvas: <select id="epi3"><option>SIM</option><option>NÃO</option></select></label>
<label>Óculos: <select id="epi4"><option>SIM</option><option>NÃO</option></select></label>

<hr>

<h3>Observações</h3>
<textarea id="obs18"></textarea>

<button class="btn pdf" onclick="gerarPDF_NR18()">📄 Gerar PDF NR18 Oficial</button>
<button class="btn back" onclick="abrir('menu')">⬅ Voltar</button>
</section>

<script>
/* ================= MENU ================= */
function abrir(id){
  document.querySelectorAll("section").forEach(sec=>sec.style.display="none");
  document.getElementById(id).style.display="block";
}

/* ================= ITENS RISCO ================= */
const itensRisco=[
 "Funcionário treinado na atividade?",
 "Exame médico OK?",
 "Risco de contato com partes energizadas?",
 "Tempo seco e sem vento forte?",
 "Existe risco de queda de objetos?",
 "Área isolada e sinalizada?",
 "Local seguro para fixação do cinto?",
 "Linha de vida instalada? ✅"
];

function montarRiscos(id){
  let html="";
  itensRisco.forEach((t,i)=>{
    html+=`
    <label>${t}
      <select id="${id}_${i}">
        <option>SIM</option>
        <option>NÃO</option>
        <option>N/A</option>
      </select>
    </label><br><br>`;
  });
  document.getElementById(id).innerHTML=html;
}

montarRiscos("riscos35");
montarRiscos("riscos18");

/* ================= 5 TRABALHADORES + ASSINATURA ================= */
let pads=[];

function carregarTrabalhadores(){
  let div=document.getElementById("listaTrabalhadores");
  div.innerHTML="";
  pads=[];

  for(let i=1;i<=5;i++){
    div.innerHTML+=`
      <h4>Trabalhador ${i}</h4>
      <input id="nome${i}" placeholder="Nome completo">
      <input id="cpf${i}" placeholder="CPF obrigatório">

      <small>Assinatura Digital:</small>
      <canvas id="canvas${i}"></canvas>
      <button class="btn back" onclick="limparCanvas(${i})">Limpar</button>
      <hr>
    `;
  }

  setTimeout(()=>{
    for(let i=1;i<=5;i++){
      let canvas=document.getElementById("canvas"+i);
      canvas.width=canvas.offsetWidth;
      canvas.height=140;
      iniciarAssinatura(canvas,i);
    }
  },300);
}

function iniciarAssinatura(canvas,i){
  let ctx=canvas.getContext("2d");
  let desenhando=false;

  canvas.addEventListener("pointerdown",e=>{
    desenhando=true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX,e.offsetY);
  });

  canvas.addEventListener("pointermove",e=>{
    if(!desenhando) return;
    ctx.lineTo(e.offsetX,e.offsetY);
    ctx.stroke();
  });

  canvas.addEventListener("pointerup",()=>desenhando=false);

  pads[i]={canvas,ctx};
}

function limparCanvas(i){
  pads[i].ctx.clearRect(0,0,pads[i].canvas.width,pads[i].canvas.height);
}

/* Auto carregar trabalhadores */
carregarTrabalhadores();

/* ================= PDF NR35 ================= */
function gerarPDF_NR35(){
  const { jsPDF } = window.jspdf;
  let doc=new jsPDF();

  doc.setFontSize(14);
  doc.text("NR35 – AUTORIZAÇÃO TRABALHO EM ALTURA",10,15);

  doc.setFontSize(11);
  doc.text("Local: "+local35.value,10,30);
  doc.text("Empresa: "+empresa35.value,10,38);

  let y=55;
  doc.text("Checklist Fiscalização:",10,y);
  y+=10;

  itensRisco.forEach((t,i)=>{
    let val=document.getElementById("riscos35_"+i).value;
    doc.text("- "+t+" ["+val+"]",10,y);
    y+=7;
  });

  y+=10;
  doc.text("Trabalhadores Autorizados:",10,y);
  y+=10;

  for(let i=1;i<=5;i++){
    doc.text("Nome: "+document.getElementById("nome"+i).value,10,y);
    doc.text("CPF: "+document.getElementById("cpf"+i).value,10,y+6);

    let img=pads[i].canvas.toDataURL("image/png");
    doc.addImage(img,"PNG",120,y-2,70,18);

    y+=22;
  }

  doc.save("NR35_Oficial.pdf");
}

/* ================= PDF NR18 ================= */
function gerarPDF_NR18(){
  const { jsPDF } = window.jspdf;
  let doc=new jsPDF();

  doc.setFontSize(14);
  doc.text("NR18 – CHECKLIST FISCALIZAÇÃO",10,15);

  doc.setFontSize(11);
  doc.text("Obra: "+obra18.value,10,30);
  doc.text("Responsável: "+resp18.value,10,38);

  let y=55;
  doc.text("Riscos Gerais:",10,y);
  y+=10;

  itensRisco.forEach((t,i)=>{
    let val=document.getElementById("riscos18_"+i).value;
    doc.text("- "+t+" ["+val+"]",10,y);
    y+=7;
  });

  y+=10;
  doc.text("EPI:",10,y);
  y+=8;

  doc.text("Capacete: "+epi1.value,10,y); y+=7;
  doc.text("Botina: "+epi2.value,10,y); y+=7;
  doc.text("Luvas: "+epi3.value,10,y); y+=7;
  doc.text("Óculos: "+epi4.value,10,y); y+=7;

  y+=10;
  doc.text("Observações:",10,y);
  y+=7;
  doc.text(obs18.value,10,y);

  doc.save("NR18_Oficial.pdf");
}

/* ================= WHATSAPP OPÇÃO 2 ================= */
function enviarWhats(){
  let msg =
   "📋 NR35 preenchida!\n\n" +
   "Obra: "+local35.value+"\n" +
   "Empresa: "+empresa35.value+"\n\n" +
   "PDF foi gerado no celular.\n" +
   "Agora ANEXE o arquivo e envie.\n\n" +
   "Eng. Jadison Fernandes";

  window.open(
    "https://wa.me/5547988837699?text="+encodeURIComponent(msg)
  );
}
</script>

</body>
</html>
