<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema SST – NR35 + NR18</title>

<!-- jsPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<!-- AutoTable (tabelas oficiais) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

<style>
body{font-family:Arial;margin:0;padding:15px;background:#f4f6f8;}
header{text-align:center;padding:20px;background:#003366;color:#fff;border-radius:12px;}
h1{margin:0;font-size:22px;}

.btn{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:none;
  border-radius:12px;
  background:#0059b3;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.pdf{background:darkred;}
.back{background:gray;}
.whats{background:#25D366;}

section{
  display:none;
  background:white;
  padding:15px;
  margin-top:15px;
  border-radius:12px;
}

input,select{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  margin-top:6px;
}

canvas{
  width:100%;
  height:140px;
  border:2px solid black;
  border-radius:10px;
  background:white;
  touch-action:none;
}

hr{margin:20px 0;}
</style>
</head>

<body>

<header>
<h1>Sistema Único SST</h1>
<p><b>FREIBERGER & FERNANDES – Engenharia</b></p>
<p>Padrão Fiscalização Oficial</p>
</header>

<section id="menu" style="display:block;">
<button class="btn" onclick="abrir('nr35')">📋 NR35 – Trabalho em Altura</button>
</section>

<!-- ================= NR35 ================= -->
<section id="nr35">
<h2>📋 NR35 – Autorização Trabalho em Altura</h2>

<label>Local da Obra:</label>
<input id="local35">

<label>Empresa:</label>
<input id="empresa35">

<hr>

<h3>Trabalhadores (5) + Assinatura</h3>
<div id="listaTrabalhadores"></div>

<button class="btn pdf" onclick="gerarPDF_NR35()">📄 Gerar PDF Oficial NR35</button>
<button class="btn whats" onclick="enviarWhats()">📲 WhatsApp Engenheiro</button>
<button class="btn back" onclick="abrir('menu')">⬅ Voltar</button>
</section>

<script>
/* MENU */
function abrir(id){
  document.querySelectorAll("section").forEach(sec=>sec.style.display="none");
  document.getElementById(id).style.display="block";
  if(id==="nr35") carregarTrabalhadores();
}

/* ================= CHECKLIST OFICIAL NR35 ================= */
const checklistNR35=[
 ["Funcionário treinado na atividade?"],
 ["Exame médico ocupacional válido?"],
 ["Risco de contato com energia elétrica?"],
 ["Área isolada e sinalizada?"],
 ["Linha de Vida instalada e inspecionada?"],
 ["Cinturão paraquedista em perfeito estado?"],
 ["Talabarte com absorvedor íntegro?"],
 ["Trava-quedas funcionando corretamente?"],
 ["Mosquetões sem deformações?"],
 ["Guarda-corpo e rodapé instalados?"],
 ["Ancoragem validada com ART?"]
];

/* ================= TRABALHADORES ================= */
let pads=[];

function carregarTrabalhadores(){
  let div=document.getElementById("listaTrabalhadores");
  div.innerHTML="";
  pads=[];

  for(let i=1;i<=5;i++){
    div.innerHTML+=`
      <h4>Trabalhador ${i}</h4>
      <input id="nome${i}" placeholder="Nome completo">
      <input id="cpf${i}" placeholder="CPF obrigatório">

      <canvas id="canvas${i}"></canvas>
      <button class="btn back" onclick="limparCanvas(${i})">Limpar</button>
      <hr>
    `;
  }

  setTimeout(()=>{
    for(let i=1;i<=5;i++){
      let canvas=document.getElementById("canvas"+i);
      canvas.width=canvas.offsetWidth;
      canvas.height=140;
      iniciarAssinatura(canvas,i);
    }
  },300);
}

function iniciarAssinatura(canvas,i){
  let ctx=canvas.getContext("2d");
  let desenhando=false;

  canvas.addEventListener("pointerdown",e=>{
    desenhando=true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX,e.offsetY);
  });

  canvas.addEventListener("pointermove",e=>{
    if(!desenhando) return;
    ctx.lineTo(e.offsetX,e.offsetY);
    ctx.stroke();
  });

  canvas.addEventListener("pointerup",()=>desenhando=false);

  pads[i]={canvas,ctx};
}

function limparCanvas(i){
  pads[i].ctx.clearRect(0,0,pads[i].canvas.width,pads[i].canvas.height);
}

/* ================= PDF OFICIAL NR35 ================= */
function gerarPDF_NR35(){

  const { jsPDF } = window.jspdf;
  let doc=new jsPDF("p","mm","a4");

  doc.setFontSize(14);
  doc.text("NR35 – AUTORIZAÇÃO PARA TRABALHO EM ALTURA",14,15);

  doc.setFontSize(11);
  doc.text("Local: "+local35.value,14,25);
  doc.text("Empresa: "+empresa35.value,14,32);

  /* ====== TABELA CHECKLIST OFICIAL ====== */
  let corpo=[];

  checklistNR35.forEach(item=>{
    corpo.push([item[0],"","","",""]);
  });

  doc.autoTable({
    startY: 40,
    head:[["ITEM","SIM","NÃO","N/A","MEDIDAS DE SEGURANÇA"]],
    body: corpo,
    styles:{fontSize:9},
    theme:"grid",
    headStyles:{fillColor:[0,51,102]}
  });

  /* ====== TRABALHADORES + ASSINATURAS ====== */
  let y=doc.lastAutoTable.finalY + 10;

  doc.text("TRABALHADORES AUTORIZADOS:",14,y);
  y+=5;

  for(let i=1;i<=5;i++){

    let nome=document.getElementById("nome"+i).value;
    let cpf=document.getElementById("cpf"+i).value;

    doc.text(`${i}. ${nome} – CPF: ${cpf}`,14,y);

    let img=pads[i].canvas.toDataURL("image/png");
    doc.addImage(img,"PNG",140,y-4,50,15);

    y+=18;
  }

  doc.save("NR35_Oficial_Fiscalizacao.pdf");
}

/* ================= WHATS ================= */
function enviarWhats(){
  let msg="NR35 preenchida – Local: "+local35.value+" Empresa: "+empresa35.value;
  window.open("https://wa.me/5547988837699?text="+encodeURIComponent(msg));
}
</script>

</body>
</html>
